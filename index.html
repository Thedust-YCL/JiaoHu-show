<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="AGENT / ZERO — M0.1 视觉基础原型：AZ-CORE 01、AZ / INITIALIZATION SEQUENCE 与 Control Hub。纯前端本地模拟，无后端、无真实 AI API。" />
<title>AGENT / ZERO — FROM LANGUAGE TO ACTION.</title>
<style>
/* ==========================================================================
   AGENT / ZERO — atlas.css
   M0.3 工作区外壳 + ATLAS 知识星图（延续 AZ-DESIGN v1：虚空黑、精密描边、
   Signal Cyan / Attention Amber / Error Red，重要状态不只用颜色表达）。
   ========================================================================== */

/* ---------------- 工作区外壳：覆盖整个舞台区域 ---------------- */
.workspace-host {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
  background: radial-gradient(120% 90% at 50% 30%, #0c1119 0%, #07090d 58%, #05070a 100%);
}
.workspace-host[data-open='true'] {
  display: block;
}
.workspace {
  position: absolute;
  inset: 0;
  display: grid;
  /* 单列必须显式写成 minmax(0,1fr)：隐式 auto 列会被最宽子元素的
     max-content 撑开，导致窄屏时头部与信息条溢出被裁切（实测问题） */
  grid-template-columns: minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}
.workspace--atlas,
.workspace--knowledge {
  grid-template-rows: auto minmax(0, 1fr);
}
.workspace--execution {
  grid-template-rows: auto auto minmax(0, 1fr) auto;
}

/* 工作区打开时，舞台原有的控制条、标注与二维投影层都让位 */
.stage[data-workspace='true'] .stage__chrome,
.stage[data-workspace='true'] .stage__badge,
.stage[data-workspace='true'] .port-overlay,
.stage[data-workspace='true'] .mode-overlay,
.stage[data-workspace='true'] .fallback-banner {
  display: none !important;
}

/* 工作区自带导航与检视面板：打开时把左侧导航与右侧结构检视让给工作区，
   否则三列布局会被挤成一条缝（实测发现的问题） */
.shell[data-workspace] {
  grid-template-columns: 0 minmax(0, 1fr) 0;
}
.shell[data-workspace] .dock,
.shell[data-workspace] .inspector {
  display: none;
}

/* ---------------- 工作区头部 ---------------- */
.ws-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(180deg, rgba(16, 21, 29, 0.92), rgba(9, 12, 17, 0.72));
  flex-wrap: wrap;
}
.ws-head__id {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
.ws-head__tag {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  color: var(--signal);
  border: 1px solid rgba(119, 216, 236, 0.34);
  border-radius: 3px;
  padding: 1px 6px;
}
.ws-head__title {
  font-size: var(--fs-title);
  font-weight: 500;
  letter-spacing: var(--track-tight);
  color: var(--text-1);
}
.ws-head__meta {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.ws-head__actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ======================================================================
   ATLAS
   ====================================================================== */
.atlas-grid {
  display: grid;
  grid-template-columns: 292px minmax(0, 1fr) 384px;
  gap: 10px;
  padding: 10px;
  min-height: 0;
}
.atlas-side,
.atlas-detail {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ---------------- 搜索 ---------------- */
.atlas-search {
  display: flex;
  gap: 6px;
  padding: 8px 10px 6px;
}
.atlas-search__input {
  flex: 1;
  min-width: 0;
  min-height: 30px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: rgba(7, 9, 13, 0.72);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
}
.atlas-search__input:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.atlas-search__note {
  padding: 0 10px 8px;
  font-size: var(--fs-micro);
  line-height: 1.6;
  color: var(--text-3);
  min-height: 30px;
}

/* ---------------- 概念清单（键盘与触屏的等价入口） ---------------- */
.atlas-list {
  list-style: none;
  margin: 0;
  padding: 0 8px 8px;
  overflow: auto;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.atlas-list__item {
  width: 100%;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-s);
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.atlas-list__item:hover {
  background: rgba(23, 33, 44, 0.6);
  border-color: var(--border-faint);
}
.atlas-list__item:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.atlas-list__item[aria-current='true'] {
  border-color: rgba(240, 189, 120, 0.5);
  background: rgba(240, 189, 120, 0.08);
}
.atlas-list__item[data-match='false'] {
  opacity: 0.34;
}
.atlas-list__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
  padding-top: 2px;
}
.atlas-list__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.atlas-list__name {
  font-size: var(--fs-body);
  color: var(--text-1);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.atlas-list__name em {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.atlas-list__tag {
  font-size: var(--fs-micro);
  line-height: 1.5;
  color: var(--text-3);
}
.atlas-list__state {
  grid-column: 2;
  justify-self: start;
  margin-top: 3px;
}
.atlas-side__foot {
  border-top: 1px solid var(--border-faint);
  padding: 0 10px 10px;
}
.atlas-progress {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--fs-tag);
  color: var(--text-2);
}
.atlas-progress b {
  color: var(--signal);
  font-family: var(--font-mono);
}

/* ---------------- 画布 ---------------- */
.atlas-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-l);
  background: radial-gradient(110% 80% at 50% 40%, #0b1017 0%, #070a0e 65%, #05070a 100%);
  overflow: hidden;
}
/* 少量静态星点建立深度：不随机、不闪烁 */
.atlas-stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(150, 180, 200, 0.16) 1px, transparent 1px),
    radial-gradient(rgba(150, 180, 200, 0.1) 1px, transparent 1px);
  background-size: 96px 96px, 61px 61px;
  background-position: 0 0, 22px 34px;
  pointer-events: none;
}
.atlas-graph {
  position: relative;
  flex: 1;
  min-height: 0;
}
.atlas-svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
.atlas-graph[data-grabbing='true'] .atlas-svg {
  cursor: grabbing;
}

.atlas-toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 6px;
  z-index: 2;
}
.atlas-legend {
  position: absolute;
  left: 12px;
  top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 2;
  padding: 7px 9px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(7, 9, 13, 0.78);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.atlas-legend__item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.atlas-legend__mark {
  width: 8px;
  height: 8px;
  background: var(--signal);
  border-radius: 1px;
  display: inline-block;
}
.atlas-hint {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 10px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
  z-index: 2;
  white-space: nowrap;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(7, 9, 13, 0.6);
}

/* ---------------- 节点与连线 ---------------- */
.atlas-node__halo {
  fill: rgba(119, 216, 236, 0.05);
  stroke: none;
}
.atlas-node__disc {
  fill: rgba(14, 19, 26, 0.94);
  stroke: var(--border);
  stroke-width: 1.2;
  transition: stroke 180ms var(--ease-out), fill 180ms var(--ease-out);
}
.atlas-node__ring {
  fill: none;
  stroke: rgba(140, 165, 185, 0.22);
  stroke-width: 1;
  stroke-dasharray: 2 5;
}
.atlas-node__idx {
  font-family: var(--font-mono);
  font-size: 12.5px;
  fill: var(--text-3);
  letter-spacing: 0.08em;
}
.atlas-node__name {
  font-family: var(--font-mono);
  font-size: 15px;
  fill: var(--text-1);
}
.atlas-node__cn {
  font-family: var(--font-sans);
  font-size: 12.5px;
  fill: var(--text-2);
}
.atlas-node__mark {
  fill: var(--signal);
  opacity: 0.85;
}
.atlas-node {
  cursor: pointer;
}
.atlas-node:focus-visible .atlas-node__disc {
  stroke: var(--signal);
  stroke-width: 2;
  outline: none;
}
.atlas-node.is-selected .atlas-node__disc {
  stroke: var(--attention);
  stroke-width: 2.2;
  fill: rgba(30, 24, 14, 0.94);
}
.atlas-node.is-selected .atlas-node__ring {
  stroke: rgba(240, 189, 120, 0.6);
  stroke-dasharray: none;
}
.atlas-node.is-related .atlas-node__disc {
  stroke: var(--signal);
  stroke-width: 1.7;
}
.atlas-node.is-dim {
  opacity: 0.34;
}
.atlas-node.is-match .atlas-node__disc {
  stroke: var(--signal);
  stroke-width: 2;
}
.atlas-node.is-miss {
  opacity: 0.24;
}
.atlas-node.is-focused .atlas-node__disc {
  stroke: var(--attention);
  stroke-width: 2.6;
}
.atlas-node {
  transition: opacity 200ms var(--ease-out);
}

.atlas-edge {
  cursor: pointer;
}
.atlas-edge__line {
  stroke: rgba(150, 172, 190, 0.36);
  stroke-width: 1.3;
  fill: none;
  transition: stroke 180ms var(--ease-out), stroke-width 180ms var(--ease-out);
}
.atlas-edge[data-type='USES'] .atlas-edge__line {
  stroke: rgba(119, 216, 236, 0.42);
}
.atlas-edge[data-type='CONTRASTS'] .atlas-edge__line {
  stroke: rgba(240, 189, 120, 0.42);
}
.atlas-edge__hit {
  stroke: transparent;
  stroke-width: 14;
  fill: none;
}
.atlas-edge.is-hover .atlas-edge__line,
.atlas-edge:focus-visible .atlas-edge__line {
  stroke: var(--signal);
  stroke-width: 2.4;
  outline: none;
}
.atlas-edge.is-active .atlas-edge__line {
  stroke: var(--attention);
  stroke-width: 2.2;
}
.atlas-edge.is-selected .atlas-edge__line {
  stroke: var(--attention);
  stroke-width: 2.8;
}
.atlas-edge.is-dim {
  opacity: 0.2;
}
.atlas-arrow-head {
  fill: rgba(119, 216, 236, 0.7);
}

/* ---------------- 详情 ---------------- */
.atlas-detail__scroll,
.kn-aside__scroll,
.ex-inspector__scroll {
  overflow: auto;
  flex: 1;
  min-height: 0;
  padding: 0 12px 14px;
}
.atlas-detail__hero {
  padding-top: 10px;
}
.atlas-rel {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 8px 9px;
  margin-bottom: 6px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(12, 17, 23, 0.6);
  color: inherit;
  cursor: pointer;
  font: inherit;
}
.atlas-rel:hover {
  border-color: rgba(119, 216, 236, 0.4);
}
.atlas-rel:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.atlas-rel__head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.atlas-rel__dir {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.atlas-rel__desc {
  font-size: var(--fs-tag);
  line-height: 1.65;
  color: var(--text-2);
}
.atlas-rel__other {
  font-size: var(--fs-micro);
  color: var(--signal);
}
.atlas-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.atlas-actions .btn {
  width: 100%;
  justify-content: center;
}
.atlas-actions__note {
  font-size: var(--fs-micro);
  color: var(--text-3);
  line-height: 1.6;
}

/* ---------------- 误解 / 纠错（知识页共用） ---------------- */
.misconception {
  margin-bottom: 8px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  overflow: hidden;
}
.misconception__claim,
.misconception__fix {
  display: flex;
  gap: 8px;
  padding: 7px 9px;
  font-size: var(--fs-tag);
  line-height: 1.65;
}
.misconception__claim {
  background: rgba(255, 133, 133, 0.06);
  color: var(--text-2);
}
.misconception__fix {
  background: rgba(128, 217, 180, 0.06);
  color: var(--text-1);
  border-top: 1px solid var(--border-faint);
}
.misconception__mark {
  flex: none;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--error);
  padding-top: 2px;
}
.misconception__mark--fix {
  color: var(--success);
}

@media (max-width: 1180px) {
  .atlas-grid {
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: min-content;
    overflow: auto;
  }
  .atlas-stage {
    min-height: 420px;
  }
  .atlas-side {
    max-height: 300px;
  }
  .atlas-legend {
    display: none;
  }
}

/* ---------------- 窄屏（≤900px）：整个工作区纵向滚动，头部与信息条换行 ---------------- */
@media (max-width: 900px) {
  .workspace {
    overflow-y: auto;
    overflow-x: hidden;
  }
  .workspace--execution {
    grid-template-rows: auto auto auto auto;
  }
  .ws-head {
    padding: 8px 10px;
    gap: 6px;
  }
  .ws-head__id {
    flex-basis: 100%;
    gap: 6px;
  }
  .ws-head__title {
    font-size: 15px;
  }
  .ws-head__meta,
  .ws-head__actions {
    flex-basis: 100%;
  }
  .ws-head__actions .btn {
    flex: 1 1 auto;
  }
  .atlas-grid,
  .kn-body,
  .ex-grid {
    padding: 8px;
    overflow: visible;
  }
  .atlas-stage {
    min-height: 300px;
  }
  .atlas-side {
    max-height: 240px;
  }
  .atlas-detail,
  .kn-main {
    max-height: none;
  }
  .kn-exp__list,
  .kn-exp__detail,
  .ex-graph,
  .ex-inspector {
    max-height: none;
  }
  .ex-core__stage {
    min-height: 240px;
  }
  .ex-info {
    padding: 6px 10px 7px;
  }
  .ex-info__label {
    min-width: 0;
    flex-basis: 100%;
  }
  .ex-timeline {
    margin: 0 8px 8px;
  }
  .ex-transport {
    margin-left: 0;
    width: 100%;
  }
}

/* ==========================================================================
   AGENT / ZERO — base.css  重置、排版基线、无障碍基线
   ========================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

html {
  background: var(--void);
}

body {
  margin: 0;
  background: var(--void);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

h1,
h2,
h3,
h4,
p,
figure,
ul,
ol {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: var(--signal);
  text-decoration: none;
}

canvas {
  display: block;
}

::selection {
  background: rgba(119, 216, 236, 0.28);
  color: #fff;
}

/* 可见焦点环（DESIGN_SYSTEM §11） */
:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
  border-radius: 3px;
}

/* 等宽系统标签 */
.mono {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  letter-spacing: var(--track-tight);
  font-variant-numeric: tabular-nums;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  text-transform: uppercase;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-2);
  white-space: nowrap;
}

.tag--signal {
  color: var(--signal);
  border-color: rgba(119, 216, 236, 0.38);
  background: var(--signal-dim);
}
.tag--attention {
  color: var(--attention);
  border-color: rgba(240, 189, 120, 0.38);
  background: var(--attention-dim);
}
.tag--success {
  color: var(--success);
  border-color: rgba(128, 217, 180, 0.38);
  background: var(--success-dim);
}
.tag--error {
  color: var(--error);
  border-color: rgba(255, 133, 133, 0.38);
  background: var(--error-dim);
}
.tag--muted {
  color: var(--text-3);
  border-color: var(--border-faint);
}

/* 状态点：形状 + 文字双通道，不仅靠颜色（DESIGN_SYSTEM §2.4） */
.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border: 1px solid currentColor;
  transform: rotate(45deg);
}
.dot--round {
  border-radius: 50%;
  transform: none;
}
.dot--fill {
  background: currentColor;
}

.rule {
  height: 1px;
  background: var(--border-faint);
  border: 0;
  margin: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.noscript {
  padding: 48px;
  max-width: 640px;
  margin: 0 auto;
  color: var(--text-2);
}
.noscript h1 {
  font-size: var(--fs-page);
  letter-spacing: var(--track);
  color: var(--text-1);
  margin-bottom: 12px;
}

/* 自定义细滚动条 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}

/* 面板通用表面（DESIGN_SYSTEM §2.3：1px 边框、6–8px 圆角、近黑半透明） */
.surface {
  background: linear-gradient(180deg, rgba(16, 21, 29, 0.92), rgba(9, 12, 17, 0.92));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-m);
  backdrop-filter: blur(6px);
}

.surface--raised {
  background: linear-gradient(180deg, rgba(23, 33, 44, 0.96), rgba(13, 18, 25, 0.96));
  border-color: var(--border);
}

/* 面板标题行 */
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-1);
  padding: 11px 12px 10px;
  border-bottom: 1px solid var(--border-faint);
}
.panel-head__title {

.log {

.log__t {

}

}

}

@keyframes logIn {
  from {
    opacity: 0;
    transform: translateX(-4px);

}

/* ---------- 开关式分段控件 ---------- */
.seg {

  border-radius: var(--radius-s);
  overflow: hidden;
  background: rgba(7, 9, 13, 0.6);
}

  padding: 0 10px;

  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--text-3);
  border-right: 1px solid var(--border-faint);
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.seg button:last-child {

}

}

  color: var(--signal);

}

/* ---------- 分隔与刻度装饰（仅出现在可解释位置） ---------- */
.ticks {

/* ---------- 抽屉（窄视图） ---------- */
.scrim {

/* ---------- 提示条 ---------- */

  max-width: min(46vw, 460px);
}

  opacity: 1;
  transform: translateY(0);
}

  padding: 2px 2px 3px;
}
.ex-tick {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 38px;
  padding: 2px 5px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(9, 12, 17, 0.6);
  color: var(--text-3);
  font: inherit;
  cursor: pointer;
}
.ex-tick:hover {
  border-color: rgba(119, 216, 236, 0.4);
}
.ex-tick:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.ex-tick__seq {
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.2;
}
.ex-tick__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
}
.ex-tick[data-tone='signal'] .ex-tick__dot {
  background: rgba(119, 216, 236, 0.7);
}
.ex-tick[data-status='success'] .ex-tick__dot {
  background: var(--success);
}
.ex-tick[data-status='blocked'] .ex-tick__dot {
  background: var(--attention);
}
.ex-tick[data-status='error'] .ex-tick__dot {
  background: var(--error);
}
.ex-tick[data-done='true'] {
  opacity: 0.7;
}
.ex-tick[data-current='true'] {
  border-color: var(--attention);
  background: rgba(240, 189, 120, 0.12);
  color: var(--text-1);
}
.ex-tick[data-current='true'] .ex-tick__dot {
  box-shadow: 0 0 0 3px rgba(240, 189, 120, 0.2);
}
.ex-strip__empty {
  font-size: var(--fs-micro);
  color: var(--text-3);
  padding: 6px 4px;
}
.ex-timeline__hint {
  font-size: var(--fs-micro);
  color: var(--text-3);
}

/* ---------------- 事件行（知识页与执行台共用） ---------------- */
.ev-row {
  width: 100%;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 7px;
  align-items: start;
  padding: 6px 8px;
  margin-bottom: 4px;
  border: 1px solid var(--border-faint);
  border-left: 2px solid var(--border);
  border-radius: var(--radius-s);
  background: rgba(12, 17, 23, 0.6);
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.ev-row[data-status='success'] {
  border-left-color: var(--success);
}
.ev-row[data-status='blocked'] {
  border-left-color: var(--attention);
}
.ev-row[data-status='error'] {
  border-left-color: var(--error);
}
.ev-row[data-status='started'] {
  border-left-color: var(--signal);
}
.ev-row:hover {
  background: rgba(23, 33, 44, 0.8);
}
.ev-row:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.ev-row[aria-current='true'] {
  border-color: rgba(240, 189, 120, 0.55);
  background: rgba(240, 189, 120, 0.1);
}
.ev-row__seq {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.ev-row__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.ev-row__top {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.ev-row__type {
  font-size: var(--fs-tag);
  color: var(--text-1);
}
.ev-row__code {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
}
.ev-row__msg {
  font-size: var(--fs-micro);
  line-height: 1.55;
  color: var(--text-2);
}

@media (max-width: 1280px) {
  .ex-grid {
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: min-content;
    overflow: auto;
  }
  .ex-graph {
    max-height: 320px;
  }
  .ex-core__stage {
    min-height: 320px;
  }
  .ex-inspector {
    max-height: 420px;
  }
}

/* ==========================================================================
   AGENT / ZERO — knowledge.css
   Tool Calling 知识页：四步学习路径、UNDERSTAND / INSPECT 两个深度层、
   内嵌实验与事件详情。
   ========================================================================== */

.kn-body {
  display: grid;
  grid-template-columns: 176px minmax(0, 1fr) 316px;
  gap: 10px;
  padding: 10px;
  min-height: 0;
}

/* ---------------- 学习路径 ---------------- */
.kn-steps {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
}
.kn-step {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(12, 17, 23, 0.6);
  color: inherit;
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.kn-step:hover {
  border-color: rgba(119, 216, 236, 0.4);
}
.kn-step:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.kn-step[aria-current='true'] {
  border-color: rgba(240, 189, 120, 0.5);
  background: rgba(240, 189, 120, 0.08);
}
.kn-step__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.kn-step__body {
  display: flex;
  flex-direction: column;
}
.kn-step__en {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  letter-spacing: 0.06em;
  color: var(--text-1);
}
.kn-step__cn {
  font-size: var(--fs-micro);
  color: var(--text-3);
}

/* ---------------- 主区 ---------------- */
.kn-main {
  overflow: auto;
  min-height: 0;
  padding: 2px 4px 18px;
}
.kn-hero {
  padding: 4px 2px 12px;
  border-bottom: 1px solid var(--border-faint);
  margin-bottom: 14px;
}
.kn-hero__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  color: var(--signal);
}
.kn-hero__title {
  margin: 6px 0 8px;
  font-size: 21px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-1);
  max-width: 62ch;
}
.kn-hero__lead {
  margin: 0;
  font-size: var(--fs-explain);
  line-height: 1.75;
  color: var(--text-2);
  max-width: 74ch;
}
.kn-next {
  margin-top: 16px;
}

/* ---------------- DISCOVER：对照 ---------------- */
.kn-compare {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
}
.kn-compare__col {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-m);
  padding: 11px 12px;
  background: rgba(12, 17, 23, 0.55);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kn-compare__col[data-side='no-tool'] {
  border-color: rgba(255, 133, 133, 0.24);
}
.kn-compare__col[data-side='with-tool'] {
  border-color: rgba(119, 216, 236, 0.28);
}
.kn-compare__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.kn-compare__tag {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  color: var(--text-1);
}
.kn-sample {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  padding: 8px 9px;
  background: rgba(7, 9, 13, 0.7);
}
.kn-sample--real {
  border-color: rgba(128, 217, 180, 0.32);
}
.kn-sample__label {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--attention);
  margin-bottom: 4px;
}
.kn-reveal__note,
.kn-sample__note {
  font-size: var(--fs-micro);
  color: var(--text-3);
  line-height: 1.6;
}
.kn-reveal__note {
  margin-top: 6px;
}
.kn-sample__body {
  font-size: var(--fs-tag);
  line-height: 1.7;
  color: var(--text-1);
}
.kn-reveal {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------------- UNDERSTAND：三段职责 ---------------- */
.kn-layers {
  display: inline-flex;
  gap: 0;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  overflow: hidden;
}
.kn-layers button {
  padding: 6px 12px;
  border: none;
  background: transparent;
  color: var(--text-2);
  font-family: var(--font-sans);
  font-size: var(--fs-tag);
  cursor: pointer;
}
.kn-layers button + button {
  border-left: 1px solid var(--border-faint);
}
.kn-layers button[aria-pressed='true'] {
  background: rgba(119, 216, 236, 0.14);
  color: var(--text-1);
}
.kn-layers button:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: -2px;
}

.kn-flow__rail {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 8px;
  align-items: stretch;
}
/* INSPECT 深入层：左列三段职责（纵向），右列当前段的深入说明 */
.kn-flow[data-layer='inspect'] .kn-flow__body {
  display: grid;
  grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.kn-flow[data-layer='inspect'] .kn-flow__rail {
  grid-template-columns: minmax(0, 1fr);
}
.kn-flow__link {
  display: none;
}
.kn-stage {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-m);
  padding: 10px 11px;
  background: rgba(12, 17, 23, 0.55);
  /* 非当前段仍然必须可读：只降低强调，不把正文压到看不清 */
  opacity: 0.82;
  transition: opacity 200ms var(--ease-out), border-color 200ms var(--ease-out), background 200ms var(--ease-out);
}
.kn-stage[data-active='true'] {
  opacity: 1;
  border-color: rgba(119, 216, 236, 0.5);
  background: rgba(19, 32, 42, 0.75);
}
.kn-stage__head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.kn-stage__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--signal);
}
.kn-stage__title {
  font-size: var(--fs-body);
  color: var(--text-1);
}
.kn-stage__en {
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.kn-stage__claim,
.kn-stage__detail {
  margin: 7px 0 0;
  font-size: var(--fs-tag);
  line-height: 1.7;
  color: var(--text-2);
}
.kn-stage__detail {
  color: var(--text-3);
}
.kn-stage__list {
  margin: 8px 0 0;
  padding-left: 16px;
  font-size: var(--fs-micro);
  line-height: 1.7;
  color: var(--text-3);
}
.kn-flow__controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.kn-flow__state {
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.kn-inspect {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-m);
  padding: 10px 12px 12px;
  background: rgba(9, 12, 17, 0.6);
}
.kn-inspect__head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border-faint);
}
.kn-inspect__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--signal);
}
.kn-inspect__title {
  font-size: var(--fs-body);
  color: var(--text-1);
  flex: 1;
  min-width: 0;
}
.code-block {
  margin: 6px 0;
  padding: 10px 12px;
  border: 1px solid var(--border-faint);
  border-left: 2px solid var(--signal);
  border-radius: var(--radius-s);
  background: rgba(5, 7, 10, 0.85);
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  line-height: 1.65;
  color: var(--text-1);
  overflow: auto;
  white-space: pre;
}

/* ---------------- EXPERIMENT ---------------- */
.note--isolation {
  border-color: rgba(240, 189, 120, 0.4);
  margin-bottom: 12px;
}
.kn-exp__controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.kn-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kn-field__label {
  font-size: var(--fs-micro);
  font-family: var(--font-mono);
  color: var(--text-2);
  letter-spacing: 0.04em;
}
.kn-field__hint {
  font-size: var(--fs-micro);
  color: var(--text-3);
  line-height: 1.5;
}
.kn-field--check {
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.kn-field--check input {
  width: 15px;
  height: 15px;
  accent-color: var(--signal);
}
.kn-exp__transport {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.kn-exp__state {
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.kn-exp__cols {
  display: grid;
  grid-template-columns: minmax(240px, 340px) minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.kn-exp__list,
.kn-exp__detail {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-m);
  padding: 8px 9px 10px;
  background: rgba(9, 12, 17, 0.6);
  max-height: 460px;
  overflow: auto;
}
.ev-detail__head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
.ev-detail__type {
  font-family: var(--font-mono);
  font-size: var(--fs-body);
  color: var(--text-1);
}

/* ---------------- CONNECT ---------------- */
.kn-relations {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.kn-relation {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 9px 10px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(12, 17, 23, 0.6);
  color: inherit;
  cursor: pointer;
  font: inherit;
}
.kn-relation:hover {
  border-color: rgba(119, 216, 236, 0.4);
}
.kn-relation:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.kn-relation__head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.kn-relation__name {
  font-size: var(--fs-body);
  color: var(--text-1);
}
.kn-relation__desc {
  font-size: var(--fs-tag);
  line-height: 1.65;
  color: var(--text-2);
}
.kn-finish {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* ---------------- 侧栏 ---------------- */
.kn-dist {
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  padding: 7px 9px;
  margin-bottom: 6px;
  background: rgba(12, 17, 23, 0.5);
}
.kn-dist__term {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  color: var(--signal);
}
.kn-dist__what,
.kn-dist__note {
  font-size: var(--fs-micro);
  line-height: 1.6;
  color: var(--text-2);
}
.kn-dist__note {
  color: var(--text-3);
}
.kn-progress {
  font-size: var(--fs-micro);
  line-height: 1.7;
  color: var(--text-2);
}

@media (max-width: 1180px) {
  .kn-body {
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: min-content;
    overflow: auto;
  }
  .kn-steps {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .kn-main {
    overflow: visible;
  }
  .kn-exp__cols {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ==========================================================================
   AGENT / ZERO — layout.css  Control Hub 桌面布局 / 响应式 / 开场层
   基准分辨率 1440×900（DESIGN_SYSTEM §6 / M0.1_TASK §6.1）
   ========================================================================== */
#app {
  position: fixed;
  inset: 0;
}

.shell {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: var(--dock-w) minmax(0, 1fr) var(--inspect-w);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--status-h);
  grid-template-areas:
    'top top top'
    'dock stage inspect'
    'status status status';
  gap: var(--gap-2);
  padding: var(--gap-2);
  padding-top: calc(var(--topbar-h) + var(--gap-1));
  transition: grid-template-columns var(--dur-mid) var(--ease-out),
    grid-template-rows var(--dur-mid) var(--ease-out);
}
.shell[data-inspect='off'] {
  grid-template-columns: var(--dock-w) minmax(0, 1fr) 0;
}
.shell[data-dock='rail'] {
  grid-template-columns: var(--dock-w-min) minmax(0, 1fr) var(--inspect-w);
}
.shell[data-dock='rail'][data-inspect='off'] {
  grid-template-columns: var(--dock-w-min) minmax(0, 1fr) 0;
}
.shell[data-status='off'] {
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) 0;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  z-index: var(--layer-chrome);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: var(--gap-2);
  padding: 0 var(--gap-2);
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(180deg, rgba(9, 12, 17, 0.96), rgba(7, 9, 13, 0.86));
  backdrop-filter: blur(10px);
}
.topbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(119, 216, 236, 0.4), transparent);
  opacity: 0.5;
}
.topbar__left,
.topbar__right {
  display: flex;
  align-items: center;
  gap: var(--gap-1);
  min-width: 0;
}
.topbar__right {
  justify-content: flex-end;
}
.topbar__center {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}
.topbar__center b {
  color: var(--signal);
  font-weight: 500;
}
.topbar__sep {
  width: 1px;
  height: 18px;
  background: var(--border-faint);
}
.iconbtn {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text-2);
  background: rgba(255, 255, 255, 0.015);
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.iconbtn:hover {
  color: var(--text-1);
  border-color: rgba(119, 216, 236, 0.45);
}
.iconbtn[aria-pressed='true'] {
  color: var(--signal);
  border-color: rgba(119, 216, 236, 0.5);
  background: var(--signal-dim);
}
.iconbtn svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: square;
}

/* ---------- 左导航 / 能力架 ---------- */
.dock {
  grid-area: dock;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.dock__scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px;
}
.dock__group + .dock__group {
  margin-top: 14px;
}
.dock__group-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 6px 6px;
  font-size: var(--fs-micro);
  letter-spacing: 0.1em;
  color: var(--text-3);
  white-space: nowrap;
}
.navitem {
  position: relative;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-height: 42px;
  padding: 6px 8px;
  margin-bottom: 3px;
  border: 1px solid transparent;
  border-radius: var(--radius-s);
  text-align: left;
  color: var(--text-2);
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out);
}
.navitem:hover {
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-1);
}
.navitem__idx {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.navitem__body {
  min-width: 0;
}
.navitem__name {
  display: block;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
}
.navitem__name em {
  margin-left: 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-style: normal;
  letter-spacing: var(--track);
  color: var(--text-3);
}
.navitem__cn {
  display: block;
  margin-top: 1px;
  font-size: var(--fs-micro);
  letter-spacing: 0;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
}
.navitem__flag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  color: var(--text-3);
  border: 1px solid var(--border-faint);
  border-radius: 3px;
  padding: 1px 4px;
  white-space: nowrap;
  max-width: 56px;
  overflow: hidden;
}
.navitem[aria-current='true'] {
  color: var(--text-1);
  background: linear-gradient(90deg, rgba(119, 216, 236, 0.14), rgba(119, 216, 236, 0.02));
  border-color: rgba(119, 216, 236, 0.34);
}
.navitem[aria-current='true'] .navitem__idx {
  color: var(--signal);
}
.navitem[aria-current='true']::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 9px;
  bottom: 9px;
  width: 2px;
  background: var(--signal);
}
.navitem[data-locked='true'] {
  color: var(--text-3);
}
.navitem[data-locked='true']:hover {
  background: rgba(255, 255, 255, 0.015);
  color: var(--text-2);
}
.dock[data-collapsed='true'] .navitem {
  grid-template-columns: 1fr;
  justify-items: center;
  padding: 0;
}
.dock[data-collapsed='true'] .navitem__body,
.dock[data-collapsed='true'] .navitem__flag,
.dock[data-collapsed='true'] .dock__group-label span:last-child {
  display: none;
}
.dock[data-collapsed='true'] .dock__group-label {
  justify-content: center;
}
.dock__foot {
  border-top: 1px solid var(--border-faint);
}

/* 概念词条（术语索引；M0.3 将升级为知识星图节点）
   规则：专有名词保留英文，但中文解释可就地展开 */
.term-row {
  border-bottom: 1px solid var(--border-faint);
}
.term-row:last-child {
  border-bottom: 0;
}
.term {
  display: flex;
  align-items: baseline;
  gap: 7px;
  width: 100%;
  padding: 5px 6px;
  border-radius: 3px;
  text-align: left;
  font-size: var(--fs-tag);
  color: var(--text-2);
}
.term:hover {
  background: rgba(255, 255, 255, 0.03);
}
.term__en {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  color: var(--text-1);
}
.term__cn {
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.term__ch {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-3);
  white-space: nowrap;
}
.term__note {
  display: block;
  max-height: 0;
  overflow: hidden;
  color: var(--text-2);
  font-size: var(--fs-tag);
  line-height: 1.66;
  transition: max-height var(--dur-mid) var(--ease-out), padding var(--dur-mid) var(--ease-out);
}
.term-row[data-open='true'] .term__note {
  max-height: 140px;
  padding: 0 6px 8px;
}
.term-row[data-open='true'] .term {
  background: rgba(119, 216, 236, 0.06);
}
.term-row[data-open='true'] .term__en {
  color: var(--signal);
}

/* ---------- 中央舞台 ---------- */
.stage {
  grid-area: stage;
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-l);
  background: radial-gradient(120% 90% at 50% 42%, #0d121a 0%, #07090d 62%, #05070a 100%);
}
.stage__canvas {
  position: absolute;
  inset: 0;
  z-index: var(--layer-stage);
  touch-action: none;
  cursor: grab;
}
.stage__canvas:active {
  cursor: grabbing;
}
.stage__canvas canvas {
  width: 100% !important;
  height: 100% !important;
}
.stage__fx {
  position: absolute;
  inset: 0;
  z-index: var(--layer-grid);
  pointer-events: none;
}
.stage__vignette {
  position: absolute;
  inset: 0;
  z-index: var(--layer-vignette);
  pointer-events: none;
  background: radial-gradient(94% 76% at 50% 46%, transparent 52%, rgba(3, 5, 8, 0.5) 100%);
}
/* 舞台控制条：二维投影层之上，任何视图下都可操作 */
.stage__chrome {
  position: absolute;
  inset: 0;
  z-index: var(--layer-chrome);
  pointer-events: none;
}
.stage__chrome > * {
  pointer-events: auto;
}
.stage__tl,
.stage__tr,
.stage__bl,
.stage__br {
  position: absolute;
  display: flex;
  gap: var(--gap-1);
  align-items: center;
}
.stage__tl {
  top: 14px;
  left: 14px;
}
.stage__tr {
  top: 14px;
  right: 14px;
  flex-direction: column;
  align-items: flex-end;
}
.stage__bl {
  bottom: 14px;
  left: 14px;
}
.stage__br {
  bottom: 14px;
  right: 14px;
}
/* 二维系统视图：投影层自带标题、返回入口与视图开关，舞台控制条在二维下不再重复出现，
   也不再压在结构投影上（M0.1 遗留：竖排控件与左侧投影图重叠） */
.stage[data-view='system'] .stage__tr,
.stage[data-view='system'] .stage__tl,
.stage[data-view='system'] .stage__bl,
.stage[data-view='system'] .stage__br {
  display: none;
}
.stage__readout {
  padding: 6px 9px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(7, 9, 13, 0.72);
  backdrop-filter: blur(4px);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: 0.02em;
  color: var(--text-3);
  line-height: 1.6;
  white-space: nowrap;
}
.stage__readout b {
  color: var(--text-2);
  font-weight: 500;
}
.stage__hint {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text-3);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track-tight);
}
.stage__hint kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--border-faint);
  border-radius: 3px;
  color: var(--text-2);
}
.stage__badge {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--layer-grid);
  padding: 5px 10px;
  border: 1px solid rgba(119, 216, 236, 0.3);
  border-radius: 999px;
  background: rgba(7, 9, 13, 0.8);
  color: var(--signal);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  pointer-events: none;
  white-space: nowrap;
}

/* SVG 兜底层 */
.fallback {
  position: absolute;
  inset: 0;
  z-index: var(--layer-stage);
  display: grid;
  place-items: center;
  padding: 8%;
}
.fallback svg {
  width: min(100%, 620px);
  height: auto;
  max-height: 100%;
  overflow: visible;
}
.fallback__note {
  position: absolute;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  max-width: 78%;
  text-align: center;
  color: var(--attention);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track-tight);
}

/* ---------- 右 Inspector ---------- */
.inspector {
  grid-area: inspect;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.inspector__scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.inspector__hero {
  padding: 14px 12px 12px;
  border-bottom: 1px solid var(--border-faint);
  background: linear-gradient(180deg, rgba(119, 216, 236, 0.05), transparent 70%);
}
.inspector__eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 7px;
}
.inspector__title {
  font-size: var(--fs-title);
  letter-spacing: 0.01em;
  color: var(--text-1);
  margin-bottom: 3px;
}
.inspector__sub {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  color: var(--text-2);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}
.mini {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.mini__cell {
  padding: 7px 8px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(255, 255, 255, 0.014);
}
.mini__k {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--text-3);
}
.mini__v {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  color: var(--text-1);
}
.bullets {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: var(--fs-body);
  color: var(--text-2);
}
.bullets li {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr);
  gap: 8px;
}
.bullets li::before {
  content: '';
  width: 5px;
  height: 5px;
  margin-top: 7px;
  border: 1px solid var(--text-3);
  transform: rotate(45deg);
}
.code {
  padding: 9px 10px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(4, 6, 10, 0.72);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  line-height: 1.75;
  color: var(--text-2);
  overflow-x: auto;
  white-space: pre;
}

/* ---------- 底部状态 / 事件区 ---------- */
.status {
  grid-area: status;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  overflow: hidden;
}
.status__log {
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-faint);
}
.status__diag {
  min-height: 0;
  overflow-y: auto;
  padding: 8px 12px 12px;
}
.status__diag .kv {
  grid-template-columns: 92px 1fr;
  font-size: var(--fs-tag);
}
.bar {
  height: 4px;
  border: 1px solid var(--border-faint);
  border-radius: 2px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.03);
}
.bar > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--signal), rgba(119, 216, 236, 0.35));
  transition: width var(--dur-mid) linear;
}
.bar[data-state='attention'] > i {
  background: linear-gradient(90deg, var(--attention), rgba(240, 189, 120, 0.35));
}
.bar[data-state='error'] > i {
  background: linear-gradient(90deg, var(--error), rgba(255, 133, 133, 0.35));
}

/* ---------- 开场层 AZ / INITIALIZATION SEQUENCE ---------- */
/* 关键：开场不是一个盖住舞台的黑幕。它与 Hub 共用同一个 canvas 与同一颗核心，
   因此这里只叠加「暗角 + 画框 + 字幕」，让核心从虚空里真正显现出来。 */
.boot {
  position: fixed;
  inset: 0;
  z-index: var(--layer-boot);
  background: transparent;
  transition: opacity 900ms var(--ease-out), visibility 900ms;
}
.boot[data-phase='done'] {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
/* 开场时舞台可见但没有 Hub 面板 */
.shell[data-boot='true'] .dock,
.shell[data-boot='true'] .inspector,
.shell[data-boot='true'] .status {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}
.shell[data-boot='true'] .dock,
.shell[data-boot='true'] .inspector,
.shell[data-boot='true'] .status,
.shell[data-boot='true'] .topbar {
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
}
.shell[data-boot='true'] .stage {
  border-color: transparent;
}
.shell[data-boot='true'] .stage__chrome {
  opacity: 0;
}
.shell[data-boot='true'] .topbar > *:not(.topbar__skipwrap) {
  opacity: 0.001;
}

.boot__vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(64% 54% at 50% 46%, transparent 22%, rgba(2, 3, 5, 0.42) 62%, rgba(2, 3, 5, 0.76) 100%);
}
.boot__bars::before,
.boot__bars::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  height: 7.5vh;
  background: linear-gradient(180deg, #05070a, rgba(5, 7, 10, 0.4));
  pointer-events: none;
}
.boot__bars::before {
  top: 0;
}
.boot__bars::after {
  bottom: 0;
  transform: scaleY(-1);
}
.boot__frame {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.boot__corner {
  position: absolute;
  width: 22px;
  height: 22px;
  border: 1px solid rgba(119, 216, 236, 0.42);
}
.boot__corner--tl {
  top: 26px;
  left: 26px;
  border-right: 0;
  border-bottom: 0;
}
.boot__corner--tr {
  top: 26px;
  right: 26px;
  border-left: 0;
  border-bottom: 0;
}
.boot__corner--bl {
  bottom: 26px;
  left: 26px;
  border-right: 0;
  border-top: 0;
}
.boot__corner--br {
  bottom: 26px;
  right: 26px;
  border-left: 0;
  border-top: 0;
}
.boot__hud {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  pointer-events: none;
}
/* 品牌文案落在核心下缘之外，避免与主体轮廓叠在一起 */
.boot__brandblock {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 46vh;
  opacity: 0;
  transform: translateY(14px);
}
.boot__brandblock[data-on='true'] {
  animation: bootBrand 1400ms var(--ease-out) forwards;
}
@keyframes bootBrand {
  to {
    opacity: 1;
    transform: none;
  }
}
.boot__logo {
  font-family: var(--font-mono);
  font-size: var(--fs-mega);
  letter-spacing: 0.06em;
  line-height: 1;
  color: var(--text-1);
  text-shadow: 0 0 44px rgba(119, 216, 236, 0.28);
}
.boot__logo b {
  color: var(--signal);
  font-weight: 400;
}
.boot__name {
  font-family: var(--font-mono);
  font-size: clamp(13px, 1.5vw, 20px);
  letter-spacing: 0.42em;
  color: var(--text-2);
  padding-left: 0.42em;
}
.boot__slogan {
  font-size: clamp(12px, 1.1vw, 15px);
  letter-spacing: 0.12em;
  color: var(--text-3);
}
.boot__slogan em {
  color: var(--signal);
  font-style: normal;
}
.boot__shot {
  position: absolute;
  left: clamp(26px, 4vw, 64px);
  bottom: clamp(56px, 9vh, 96px);
  display: flex;
  align-items: flex-start;
  gap: 14px;
  text-align: left;
}
.boot__shot-idx {
  font-family: var(--font-mono);
  font-size: 40px;
  line-height: 0.9;
  color: rgba(232, 237, 242, 0.18);
  letter-spacing: -0.02em;
}
.boot__shot-body {
  border-left: 1px solid rgba(119, 216, 236, 0.42);
  padding-left: 12px;
  min-width: 210px;
}
.boot__shot-en {
  font-family: var(--font-mono);
  font-size: var(--fs-tag);
  letter-spacing: var(--track);
  color: var(--signal);
}
.boot__shot-cn {
  font-size: var(--fs-explain);
  color: var(--text-2);
  margin-top: 2px;
}
.boot__shot-desc {
  font-size: var(--fs-tag);
  color: var(--text-3);
  margin-top: 5px;
  line-height: 1.6;
  max-width: 30ch;
}
.boot__skipwrap {
  position: absolute;
  right: clamp(26px, 4vw, 56px);
  bottom: clamp(56px, 9vh, 96px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 9px;
}
.boot__skip {
  min-height: 40px;
  padding: 0 18px;
  border-color: rgba(232, 237, 242, 0.28);
  letter-spacing: var(--track);
}
.boot__skip:hover {
  border-color: var(--signal);
  color: var(--signal);
}
.boot__progress {
  width: 210px;
  max-width: 42vw;
}
.boot__progress-rail {
  position: relative;
  height: 2px;
  background: rgba(232, 237, 242, 0.14);
}
.boot__progress-rail > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--signal);
  box-shadow: 0 0 12px rgba(119, 216, 236, 0.6);
}
.boot__shots {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: var(--track);
  color: var(--text-3);
}
.boot__shots span[data-active='true'] {
  color: var(--signal);
}
.boot__topline {
  position: absolute;
  top: clamp(26px, 4vh, 44px);
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 18px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  color: var(--text-3);
  opacity: 0;
  transition: opacity var(--dur-slow) var(--ease-out);
}
.boot__topline[data-on='true'] {
  opacity: 1;
}

/* ---------- 响应式（DESIGN_SYSTEM §11 / M0.1_TASK §7.1） ---------- */
@media (max-width: 1439px) {
  :root {
    --dock-w: 196px;
    --inspect-w: 306px;
  }
}
@media (max-width: 1279px) {
  :root {
    --status-h: 122px;
  }
  .status {
    grid-template-columns: minmax(0, 1fr) 258px;
  }
}
@media (max-width: 1100px) {
  .shell {
    grid-template-columns: var(--dock-w-min) minmax(0, 1fr) 0;
  }
  .shell[data-inspect='on'] {
    grid-template-columns: var(--dock-w-min) minmax(0, 1fr) 0;
  }
  .inspector {
    position: fixed;
    top: calc(var(--topbar-h) + var(--gap-1));
    right: var(--gap-2);
    bottom: calc(var(--status-h) + var(--gap-2) + var(--gap-1));
    width: min(340px, calc(100vw - 32px));
    z-index: var(--layer-drawer);
    transform: translateX(calc(100% + 24px));
    box-shadow: var(--shadow-panel);
    transition: transform var(--dur-mid) var(--ease-out);
  }
  .shell[data-inspect='on'] .inspector {
    transform: none;
  }
  .status {
    grid-template-columns: minmax(0, 1fr);
  }
  .status__diag {
    display: none;
  }
}
@media (max-width: 900px) {
  .topbar {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .topbar__center {
    display: none;
  }
}
@media (max-width: 560px) {
  .brand__sub {
    display: none;
  }
  .topbar__left {
    gap: 6px;
  }
  .brand {
    gap: 7px;
  }
  .brand__mark {
    width: 28px;
    height: 28px;
    font-size: 11px;
  }
  .brand__name {
    font-size: 11.5px;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }
  .topbar {
    padding: 0 10px;
  }
  .topbar__right {
    gap: 5px;
  }
  .iconbtn {
    width: 30px;
    height: 30px;
  }
}
@media (max-width: 767px) {
  :root {
    --topbar-h: 54px;
    --status-h: 46%;
    --gap-2: 10px;
  }
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--topbar-h) minmax(0, 1fr) 0;
    grid-template-areas:
      'top'
      'stage'
      'status';
    padding: var(--gap-2);
    padding-top: calc(var(--topbar-h) + 6px);
    gap: 10px;
  }
  /* 窄屏必须始终是单列：属性选择器（data-inspect / data-dock / data-workspace）
     的特异性高于上面的 .shell，若不在这里以同等特异性覆盖，舞台会被挤成
     「232px + 1fr + 0」的窄条——这是 M0.1/M0.2 遗留的响应式缺陷，M0.3 修复。 */
  .shell[data-dock='rail'],
  .shell[data-dock='closed'],
  .shell[data-dock='full'],
  .shell[data-inspect='off'],
  .shell[data-inspect='on'],
  .shell[data-dock='rail'][data-inspect='off'],
  .shell[data-workspace] {
    grid-template-columns: minmax(0, 1fr);
  }
  .dock {
    position: fixed;
    top: calc(var(--topbar-h) + 6px);
    left: var(--gap-2);
    bottom: var(--gap-2);
    width: min(280px, calc(100vw - 40px));
    z-index: var(--layer-drawer);
    transform: translateX(calc(-100% - 24px));
    box-shadow: var(--shadow-panel);
    transition: transform var(--dur-mid) var(--ease-out);
  }
  .shell[data-dock='open'] .dock {
    transform: none;
  }
  .shell[data-status='on'] {
    grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--status-h);
  }
  .status {
    position: fixed;
    left: var(--gap-2);
    right: var(--gap-2);
    bottom: var(--gap-2);
    top: auto;
    height: var(--status-h);
    z-index: var(--layer-drawer);
    background: rgba(10, 14, 20, 0.98);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    transform: translateY(calc(100% + 24px));
    transition: transform var(--dur-mid) var(--ease-out);
    box-shadow: var(--shadow-panel);

  }
  .status__diag {
    display: none;
  }
  .boot__shot {
    bottom: 108px;
    left: 18px;
  }
  .boot__skipwrap {
    right: 18px;
    bottom: 24px;
    align-items: stretch;
    left: 18px;
  }
  .boot__progress {
    width: 100%;
    max-width: none;
  }
  .boot__shot-desc {
    display: none;
  }
  .stage__tl,
  .stage__bl {
    display: none;
  }
  /* 移动端：底部只保留最关键的「重置视角」，其余控件上移一行 */
  .stage__br {
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    left: 14px;
    right: 14px;
    bottom: 12px;
  }
  .stage__badge {
    font-size: 9.5px;
    letter-spacing: 0.08em;
  }
}
@media (max-height: 760px) {
  :root {
    --status-h: 118px;
  }
}

/* ==========================================================================
   AGENT / ZERO — system-graph.css
   2D System Graph（PRD §5.3 System Graph 的 M0.1 视觉雏形）
   ========================================================================== */
.sg {
  width: 100%;
  height: auto;
  overflow: visible;
}
.sg-edge {
  stroke: rgba(140, 170, 190, 0.42);
  stroke-width: 1.1;
}
.sg-edge[data-type='USES'] {
  stroke: rgba(119, 216, 236, 0.55);
}
.sg-edge[data-type='PART_OF'] {
  stroke: rgba(166, 181, 193, 0.5);
}
.sg-edge[data-type='RELATED'] {
  stroke: rgba(240, 189, 120, 0.45);
}
.sg-legend text {
  fill: var(--text-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.12em;
}
/* 关系图例改为 HTML 呈现：不随 SVG 裁切丢失，也更容易读中文 */
.sg-key {
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-s);
  background: rgba(255, 255, 255, 0.014);
  font-size: var(--fs-tag);
  color: var(--text-2);
}
.sg-key__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.sg-key__label {
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  color: var(--text-3);
  min-width: 52px;
}
.sg-key__item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  color: var(--text-1);
}
.sg-key__item em {
  font-family: var(--font-sans);
  font-style: normal;
  font-size: var(--fs-micro);
  color: var(--text-3);
}
.sg-line {
  display: inline-block;
  width: 18px;
  height: 0;
  border-top: 1.4px solid rgba(140, 170, 190, 0.6);
}
.sg-line[data-type='USES'] {
  border-top-color: rgba(119, 216, 236, 0.7);
}
.sg-line[data-type='PART_OF'] {
  border-top-style: dashed;
}
.sg-line[data-type='RELATED'] {
  border-top-color: rgba(240, 189, 120, 0.6);
  border-top-style: dotted;
}
.sg-line[data-type='CONTRASTS'] {
  border-top-color: var(--error);
  border-top-style: double;
}
.sg-node {
  cursor: pointer;
  transition: opacity var(--dur-mid) var(--ease-out);
}
.sg-node .sg-halo {
  fill: none;
  stroke: rgba(119, 216, 236, 0.14);
  stroke-width: 1;
}
.sg-node .sg-disc {
  fill: rgba(14, 20, 27, 0.92);
  stroke: rgba(150, 180, 200, 0.5);
  stroke-width: 1;
}
.sg-node .sg-title {
  fill: var(--text-1);
  font-family: var(--font-mono);
  font-size: 9px;
  text-anchor: middle;
  letter-spacing: 0.04em;
}
.sg-node .sg-cn {
  fill: var(--text-3);
  font-size: 9.5px;
  text-anchor: middle;
}
.sg-node:hover .sg-disc {
  stroke: var(--signal);
}
.sg-node.is-dim {
  opacity: 0.34;
}
.sg-node.is-selected .sg-disc {
  stroke: var(--attention);
  fill: rgba(43, 33, 18, 0.9);
}
.sg-node.is-selected .sg-halo {
  stroke: rgba(240, 189, 120, 0.4);
}
.sg-node:focus-visible {
  outline: none;
}
.sg-node:focus-visible .sg-disc {
  stroke: var(--signal);
  stroke-width: 2;
}

/* 2D 结构投影（SYSTEM 视图 / WebGL 兜底）
   注意：层级必须低于舞台控制条（--layer-chrome），否则「返回三维」按钮会被盖住 */
.projection {
  position: absolute;
  inset: 0;
  z-index: var(--layer-projection);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: radial-gradient(110% 80% at 50% 40%, #0c1119 0%, #07090d 66%, #05070a 100%);
}
.projection__main {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
  gap: 14px;
  min-height: 0;
  padding: 14px;
}
.projection__core {
  position: relative;
  min-height: 0;
  border: 1px solid var(--border-faint);
  border-radius: var(--radius-m);
  background: rgba(255, 255, 255, 0.012);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding: 10px 12px;
}
.projection__core-head,
.projection__core-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.projection__core-head {
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-faint);
}
.projection__core-foot {
  padding-top: 6px;
  border-top: 1px solid var(--border-faint);
  font-family: var(--font-sans);
  letter-spacing: 0;
  font-size: var(--fs-tag);
  line-height: 1.5;
}
.projection__graph {
  min-height: 0;
  overflow: auto;
  padding-bottom: 6px;
}
@media (max-width: 1100px) {
  .projection__main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(200px, 1fr) auto;
  }
}
.projection__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  min-height: 44px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--border-faint);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  letter-spacing: var(--track);
  color: var(--text-3);
}
.projection__bar-text {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}
.projection__sim {
  color: var(--signal);
}
.projection__bar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.projection__bar-actions .btn {
  font-family: var(--font-sans);
  font-size: var(--fs-tag);
  letter-spacing: 0;
}
.projection__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 10px 14px;
  border-top: 1px solid var(--border-faint);
  color: var(--text-3);
  font-size: var(--fs-tag);
}
.projection__legend {
  display: flex;
  flex-wrap: wrap;
  flex: 1 1 auto;
  min-width: 0;
  gap: 6px 12px;
}
.projection__legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.projection__foot .mono {
  flex: none;
}
.projection__legend i {
  width: 14px;
  height: 2px;
  display: inline-block;
}
